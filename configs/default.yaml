# Vantage - default configuration (ingestion, detection, tracking)
#
# Every key here matches a field in vantage.config.schema and may be overridden
# from the command line:  vantage run --set ingest.queue_size=16
# Unknown keys are a hard error with a suggestion, never a silent no-op.

app:
  log_level: INFO          # DEBUG | INFO | WARNING | ERROR | CRITICAL
  log_format: console      # console (human) | json (aggregation)
  stats_interval_s: 5.0    # periodic telemetry summary; 0 disables

source:
  # synthetic:// is the default so the platform runs on any machine, with no
  # camera and no sample footage. Switch to webcam:0 for the local camera.
  uri: "synthetic://?width=1280&height=720&fps=30&objects=5"
  id: null                 # defaults to a stable id derived from the URI
  backend: auto            # auto | msmf | dshow | ffmpeg | gstreamer | v4l2 | any
  width: null              # requested capture geometry; drivers may refuse
  height: null
  fps: null
  fourcc: null             # e.g. MJPG - often unlocks higher USB webcam frame rates
  loop: false              # restart file sources at EOF
  read_retries: 3          # tolerated consecutive empty reads before failing
  reconnect:
    enabled: true          # live sources only
    max_attempts: 5
    initial_delay_s: 0.5
    max_delay_s: 10.0
    backoff: 2.0

ingest:
  mode: threaded           # threaded (decoupled capture) | inline (deterministic)
  queue_size: 8            # frames buffered between capture and consumer
  backpressure: auto       # auto -> latest for live sources, block for files
  target_fps: null         # throttle delivery; the cheapest CPU-fit lever in Phase 2
  stride: 1                # deliver every Nth frame (deterministic sampling)
  realtime: false          # pace recorded sources to their own timeline
  max_frames: null         # stop after N delivered frames

detection:
  # Off by default so ingestion still runs on a machine with no model
  # downloaded and no inference runtime installed.
  enabled: false
  model: yolox-nano       # see 'vantage models list' for sizes, mAP and licences
  backend: auto           # auto | onnxruntime | openvino  (auto prefers openvino)
  device: auto            # auto | cpu | gpu  (openvino only; auto uses a real GPU if present)
  confidence: 0.35
  nms_iou: 0.45
  max_detections: 100
  classes: null           # e.g. [person, car] - narrower is faster and better practice
  interval: 1             # run the detector every Nth delivered frame
  warmup: 2               # blank passes at startup to absorb graph compilation
  threads: 0              # 0 = runtime decides
  model_dir: models       # weights are downloaded on demand, never committed
  allow_download: true    # false for air-gapped deployments

tracking:
  # Off by default, like detection. Requires detection.enabled.
  # Values are the measured output of 'vantage track tune' (see README S6).
  enabled: false
  detection_floor: 0.1   # detector threshold used while tracking; see below
  high_threshold: 0.3    # above this a box joins the first association pass
  low_threshold: 0.1     # between low and high a box may only sustain a track
  init_threshold: 0.5    # confidence needed to create a track (>= high_threshold)
  iou_high: 0.2          # minimum overlap, first association pass
  iou_low: 0.4           # minimum overlap, low-confidence second pass
  iou_tentative: 0.4     # minimum overlap for an unconfirmed track
  min_hits: 3            # frames of corroboration before a track is published
  max_lost_s: 1.5        # seconds a track survives unmatched (seconds, not frames)
  max_step_s: 2.0        # elapsed times beyond this are clamped, not extrapolated
  history: 30            # centre positions kept per track, for motion trails
  class_aware: true      # never associate a detection across class boundaries
  measurement_noise: 0.05      # detector box error, as a fraction of object height
  acceleration_noise: 2.0      # unmodelled acceleration, object heights per second^2
  initial_velocity_noise: 1.0  # velocity prior for a new track
  size_drift_noise: 0.2        # how fast box size may change (size has no velocity)
  #
  # detection_floor is the non-obvious one. ByteTrack keeps identity through
  # occlusion by matching the LOW-confidence boxes an occluded object produces,
  # so enabling tracking lowers the detector's threshold from detection.confidence
  # to this value - otherwise those boxes never arrive and the algorithm quietly
  # degrades to plain IoU tracking. The run logs the change when it happens.

pose:
  # Human pose estimation. Off by default; requires tracking.enabled, because
  # it is top-down and takes its person boxes from tracks - which is also what
  # binds each skeleton to a stable anonymous entity id.
  enabled: false
  model: rtmpose-s       # 'vantage models list' shows the pose entries
  backend: auto
  device: auto
  interval: 1            # estimate on every Nth TRACKING step, not every frame
  max_persons: 6         # cost is linear in people; this caps it, largest first
  min_keypoint_confidence: 0.3   # below this a landmark counts as not observed
  classes: [person]
  include_face_keypoints: true
  threads: 0
  model_dir: models
  allow_download: true
  #
  # include_face_keypoints keeps the five head landmarks - nose, eyes, ears.
  # They are coordinates, not a face descriptor: no crop is retained, no
  # embedding is computed, and nothing here is comparable between two people.
  # Set it to false and they are never constructed at all.

state:
  # Motion state, dwell timing and path length for every tracked entity.
  # Needs no model and no weights - it reads the velocity the tracker's Kalman
  # filter already maintains - so it is on whenever tracking is.
  enabled: true
  moving_above: 0.15     # entity heights per second at which motion is declared
  stationary_below: 0.08 # lower edge of the dead band; between the two, state holds
  min_state_s: 0.5       # a change must persist this long before it is published
  min_age_s: 0.3         # no state claimed until a track has existed this long
  #
  # Speed is in heights per second rather than pixels so that one threshold
  # works across the frame: a person at the far end of a corridor covers a
  # handful of pixels per second and the same person near the lens covers
  # hundreds, and both are walking.

activity:
  # Temporal activity recognition. Needs no model and no weights - it reads the
  # motion state and posture the earlier stages already produce - so it is on
  # whenever tracking and state are. Without pose, the posture-derived
  # activities simply never fire.
  enabled: true
  walking_speed: 0.15      # heights per second; keep equal to state.moving_above
  running_speed: 1.30      # and above which it is running
  sustain_s: 0.4           # how long a continuous rule must hold before reporting
  loiter_s: 20.0           # stationary this long becomes loitering
  transition_window_s: 2.5 # longest posture change still paired as one transition
  fall_window_s: 1.2       # upright to lying faster than this is a fall
  transient_hold_s: 1.5    # how long a one-off event keeps being reported
  posture_window_s: 0.6    # window a posture must dominate to become "stable"
  min_posture_confidence: 0.25
  min_keypoint_confidence: 0.3
  history: 240             # samples kept per entity (8 seconds at 30 fps)
  #
  # fall_window_s is the one to read twice. A person lowering themselves
  # deliberately takes longer than this and is reported as NOTHING - not as a
  # low-confidence fall - because a hedged alert trains whoever reads it to
  # ignore the real one. This is not a certified fall detector; see the
  # limitations in README S8 before relying on it.

# Adaptive load shedding lives under `app:` above. Shown here as a comment
# because it is nested, and because the strict loader rejects an unknown
# top-level key - which is how this comment came to exist at all.
#
#   app:
#     adaptive:
#       enabled: true        # analyse fewer frames well rather than fall behind
#       headroom: 0.7        # fraction of the frame budget analysis may occupy
#       max_interval: 8      # ceiling; past this the tracker's gaps get too big
#       raise_after_s: 1.0   # over budget this long before raising
#       lower_after_s: 6.0   # under budget this long before lowering
#
# LIVE SOURCES ONLY. A recorded file has no deadline, so shedding load there
# would discard information for nothing; the governor stands down and logs why.
# Every interval change is logged with its reason, and the run summary reports
# the peak interval and the time spent degraded.

spatial:
  # Zones and pairwise relations. Needs no model - geometry over the tracks and
  # poses the earlier stages already produce - so it is on whenever tracking is.
  enabled: true

  # Zones are polygons in NORMALISED coordinates, so a zone drawn against a
  # 1080p stream still means the same part of the scene at 720p. An entity is
  # in a zone when its ground point - the bottom centre of its box - is inside.
  # Overlapping zones are fine; an entity is reported in all of them.
  zones: []
  # zones:
  #   - name: doorway
  #     kind: entrance
  #     points: [[0.35, 0.5], [0.65, 0.5], [0.65, 1.0], [0.35, 1.0]]

  near_distance: 1.5       # entity heights; under a common-ground assumption
  near_hysteresis: 0.3     # extra distance needed to STOP being near
  approach_rate: 0.25      # heights per second of closing before it is reported
  approach_window_s: 0.8
  interact_distance: 0.6   # must not exceed near_distance
  interact_s: 1.0          # how long before proximity becomes interaction
  reach_confidence: 0.35   # wrist landmark score for a reach to count
  zone_event_hold_s: 1.5
  max_entities: 24         # relations are pairwise, so the cost is quadratic
  history: 120
  #
  # Distances here are entity heights, NOT metres, and they rest on entities
  # sharing a ground plane. A camera has no depth: two people on opposite sides
  # of a room can have overlapping boxes. That is why interaction is reported at
  # two confidence levels - 0.85 when a wrist landmark is inside the object's
  # box, 0.4 for sustained proximity alone - and why proximity alone also
  # requires the person to be stationary. Measured: a person ambling past a
  # static object satisfied any sustain threshold and produced 49 frames of
  # false interaction until the motion gate was added.

events:
  # Discrete events raised from the continuous observations above. Needs no
  # model. On whenever tracking is, because the defaults do nothing on a quiet
  # scene: the only ALERT is a fall, and the zone rules are inert until zones
  # are drawn.
  enabled: true

  # An EMPTY list means the built-in defaults, not "no rules". Silencing every
  # alert takes `enabled: false`, so that a stray edit here cannot do it
  # quietly. Run 'vantage events rules' to see what is actually active.
  rules: []
  # rules:
  #   - type: activity        # falling, running, loitering, arm_raised, ...
  #     activity: falling
  #     severity: alert       # info | notice | alert
  #     cooldown_s: 15
  #     name: fall
  #   - type: zone_entry
  #     zones: [doorway]
  #     severity: info
  #   - type: zone_dwell
  #     zones: [entrance]
  #     min_seconds: 30
  #     severity: notice
  #   - type: zone_occupancy
  #     zones: [hall]
  #     min_count: 5
  #     severity: notice
  #   - type: relation
  #     relation: interacting_with
  #     min_confidence: 0.8   # 0.85 is reach-confirmed; 0.4 is proximity only
  #     severity: notice
  #
  # cooldown_s is per rule PER ENTITY. Phase 5 holds a transient activity for
  # 1.5s so a slow consumer cannot miss it - 45 frames at 30 fps - so without a
  # cooldown one fall would raise 45 alerts, and a channel that cries 45 times
  # teaches its reader to ignore it. Suppressed firings are counted and
  # reported, never hidden.

storage:
  # Persisting observations and events to a SQLite file. OFF by default: a tool
  # that silently created a growing database in whatever directory it was
  # launched from would be a surprise, and an unwanted one where disk is the
  # constraint. Turn it on with --store, and query it with 'vantage history'.
  enabled: false
  path: vantage.db

  store_observations: true   # events alone are tiny; observations fill the disk
  observation_interval: 15   # record one analysed frame in N
  batch_size: 200            # rows per transaction
  flush_interval_s: 2.0      # or commit after this long, whichever comes first
  observation_queue: 5000    # separate queues: a flood of observations must
  event_queue: 1000          # never crowd out an event
  retention_days: 30.0       # 0 disables pruning (and the disk fills eventually)
  event_retention_days: 365.0
  #
  # observation_interval is the lever that matters. At 30 fps with four
  # entities, recording every frame is 120 rows a second - ten million a day,
  # nearly all identical to their predecessor, because entity state changes on
  # the scale of seconds. Sampling deliberately is reproducible; letting the
  # queue overflow is not, because what is lost then depends on when the disk
  # happened to be busy.
  #
  # Events are never sampled and never dropped quietly: a dropped event is
  # logged as an ERROR, because each one is the output of a rule that already
  # decided it was worth someone's attention.

dashboard:
  # A local web dashboard: live view, current entities, and searchable history.
  # OFF by default; --dashboard turns it on. Built on the standard library -
  # http.server, MJPEG and one self-contained HTML file - so it adds no
  # dependencies and needs no build step.
  enabled: false
  host: 127.0.0.1     # LOOPBACK ON PURPOSE - see below
  port: 8080          # 0 asks the OS for a free port
  jpeg_quality: 70
  max_width: 960      # frames are downscaled for the browser
  #
  # The host default is a security decision, not a convenience one. This serves
  # LIVE CAMERA FOOTAGE and stored observations with NO AUTHENTICATION of any
  # kind. Binding to 0.0.0.0 puts that on the network for anything that can
  # reach the port. It is allowed - behind a reverse proxy that terminates TLS
  # and authenticates, that is a legitimate deployment - but it has to be asked
  # for, and it logs a warning saying exactly what it means.
  #
  # Every endpoint is read-only. Pruning and configuration stay on the CLI,
  # where the operator is by definition the person at the machine.

identity:
  # Answering *who*, and the only subsystem in this project that does.
  #
  # OFF by default and not on by accident. --identify turns it on, and it
  # implies --track, because identity attaches a name to an entity the tracker
  # is already following anonymously. Nothing above it depends on it: with this
  # section removed entirely, every other stage behaves identically.
  enabled: false
  path: identities.db   # its own database, separate from observations
  #
  # WHAT IS STORED: a 128-dimensional vector per enrolled person, and nothing
  # else. No face image is written to disk at any point. That is not the same
  # as anonymity - a face template is biometric data, and deleting the file is
  # the only way to unstore it. `vantage identity forget --name X` removes the
  # template and keeps the audit record that it was removed.
  #
  # ENROLMENT IS NEVER AUTOMATIC. There is no code path from the running
  # pipeline into the gallery; a face cannot become an identity by being seen.
  # Enrolment happens through `vantage identity enroll --consent`, and the
  # consent flag asserts that the person knows and agreed.

  detector_model: yunet-face   # YuNet, MIT
  embedder_model: sface        # SFace, Apache-2.0
  model_dir: models
  allow_download: true
  face_score: 0.7              # detector confidence for a face to count

  threshold: 0.363
  # The cosine similarity a match must reach. This is the figure OpenCV Zoo
  # publishes for these weights - inherited, not measured here. Verifying it
  # properly needs a labelled set of real faces, which this project has no
  # business collecting. It is exposed here for that reason: if you validate it
  # on your own camera and people, change it.

  margin: 0.05
  # How far ahead of the runner-up the winner must be. Similarity alone is the
  # usual advice and is how systems confidently use the wrong name: with two
  # enrolled people who look somewhat alike, a face can clear the threshold
  # against both and be named after whichever scored 0.001 higher. Below this
  # margin the answer is `unknown`, which is what the evidence actually says.

  interval: 10          # tracking steps between attempts on an unresolved track
  min_votes: 3          # agreeing observations before a name is committed
  max_attempts: 25      # then settle on unknown rather than retrying forever
  reverify_interval: 150
  # Steps between re-checking a track that already has a name. The tracker can
  # swap two people who cross, and nothing else downstream would ever notice;
  # a resolved track whose face stops matching is returned to unresolved rather
  # than left confidently wrong. 0 disables.

  min_face_fraction: 0.04
  # Smallest face worth embedding, as a fraction of the person box height. A
  # distant person's face is a dozen pixels, and embedding it yields a
  # confident-looking vector containing no information.

display:
  enabled: true
  window_name: "Vantage - Ingestion"
  hud: true                # telemetry overlay; 'h' toggles it at runtime
  scale: 1.0               # display-only; never changes frames given to consumers
  snapshot_dir: snapshots  # where the 's' key writes PNGs
